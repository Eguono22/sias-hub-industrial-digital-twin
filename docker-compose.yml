services:
  db:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: sias
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
      POSTGRES_DB: sias_twin
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - twin-data:/var/lib/postgresql/data
      - ./database/001_telemetry.sql:/docker-entrypoint-initdb.d/001_telemetry.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sias -d sias_twin"]
      interval: 5s
      retries: 10
volumes:
  twin-data:
