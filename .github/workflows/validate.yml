name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
      - run: npm run typecheck

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: sias
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sias_twin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sias -d sias_twin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Apply TimescaleDB migration
        env:
          DATABASE_CONTAINER: ${{ job.services.timescaledb.id }}
        run: docker exec -i "$DATABASE_CONTAINER" psql -U sias -d sias_twin_test -v ON_ERROR_STOP=1 < database/001_telemetry.sql
      - name: Run backend tests including persistence
        run: python -m pytest backend/tests -q
        env:
          TEST_DATABASE_URL: postgresql://sias:ci-only-password@127.0.0.1:5432/sias_twin_test
